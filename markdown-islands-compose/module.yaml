product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

apply:
  - ../common-lib.module-template.yaml

dependencies:
  - ../markdown-islands-core: exported
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $libs.markdown.renderer.m3
  - $libs.markdown.renderer.code
  - $libs.highlights

settings:
  compose:
    enabled: true
  publishing:
    pom:
      name: markdown-islands-compose
      description: Compose Multiplatform interactive Markdown renderer with Highlights syntax coloring and pluggable IslandRegistry.
